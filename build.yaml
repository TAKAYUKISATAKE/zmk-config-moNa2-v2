# Temporary left-only USB logging build. No reset image and no right-side build.
---
include:
  - board: xiao_ble/nrf52840/zmk
    shield: mona2_l rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: '-DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000'
    artifact-name: mona2_l-usb-diagnostic
